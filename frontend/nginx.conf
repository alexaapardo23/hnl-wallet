# React Router uses client-side routing (/login, /dashboard,
# /accounts/:accountNumber, /chat) — without this fallback, refreshing on
# any route but "/" would 404, since nginx would otherwise look for a real
# file at that path instead of letting index.html's JS take over routing.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
