services:
  postgres:
    image: postgres:16
    container_name: hnl-postgres
    environment:
      POSTGRES_DB: hnl_wallet
      POSTGRES_USER: hnl_user
      POSTGRES_PASSWORD: hnl_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hnl_user -d hnl_wallet"]
      interval: 5s
      timeout: 5s
      retries: 10

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:latest
    container_name: hnl-tigerbeetle
    # Requires the data file to already be formatted — see README
    # TigerBeetle for the one-time `... format ...` step against this same
    # volume before the first `docker compose up`.
    command: start --addresses=0.0.0.0:3000 /data/0.tigerbeetle
    ports:
      - "3000:3000"
    volumes:
      - tigerbeetle_data:/data
    security_opt:
      - seccomp=unconfined

  api:
    build:
      context: ./backend
    container_name: hnl-api
    # TigerBeetle's Go *client* (not just its server) uses io_uring
    # internally, same as the tigerbeetle service below — without this,
    # tigerbeetle.NewClient() crashes the container on startup
    # ("io_uring is not available" / PermissionDenied).
    security_opt:
      - seccomp=unconfined
    depends_on:
      postgres:
        condition: service_healthy
      tigerbeetle:
        condition: service_started
    environment:
      # Container-to-container addresses — services reach each other by
      # name on Docker's internal network, never by 127.0.0.1/localhost
      # (that's only correct for the browser, running on the host).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-hnl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hnl_password}
      POSTGRES_DB: ${POSTGRES_DB:-hnl_wallet}
      TIGERBEETLE_ADDRESS: tigerbeetle:3000
      MCP_SERVER_URL: http://mcp-server:8081/mcp
      # This one *is* browser-facing (CORS) — the frontend container is
      # reached by the browser via the host-published port, not by
      # container name, so this must stay a localhost URL.
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
    ports:
      - "8080:8080"

  mcp-server:
    build:
      context: ./backend
    container_name: hnl-mcp-server
    # Same image as `api` (see backend/Dockerfile) — just runs the other
    # binary it builds.
    command: ["./mcp-server"]
    depends_on:
      - api
    environment:
      HNL_API_URL: http://api:8080
      MCP_SERVER_PORT: 8081
    ports:
      - "8081:8081"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the JS bundle at build time (see frontend/Dockerfile)
        # — this is the URL the *browser* will call, so it's the
        # host-published API port, not the container-internal one.
        VITE_API_URL: http://localhost:8080
    container_name: hnl-frontend
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_data:
  tigerbeetle_data:
